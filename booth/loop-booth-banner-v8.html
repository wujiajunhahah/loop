<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Loop Booth Banner V8 Strict Template</title>
    <style>
      @page { size: 750mm 2000mm; margin: 0; }
      * { box-sizing: border-box; }
      html, body { width:750px; height:2000px; margin:0; background:#031127; }
      body { position:relative; overflow:hidden; }
      .banner { display:block; width:750px; height:2000px; }
      .avatar { position:absolute; top:68%; width:6.667%; height:auto; }
      .avatar-1 { left:10%; }.avatar-2 { left:26.667%; }.avatar-3 { left:43.333%; }.avatar-4 { left:60%; }.avatar-5 { left:76.667%; }
      @media print { html, body { width:750mm; height:2000mm; print-color-adjust:exact; -webkit-print-color-adjust:exact; } .banner { width:750mm; height:2000mm; } }
    </style>
  </head>
  <body>
    <img class="banner" src="loop-booth-banner-v8.svg" alt="Loop booth banner V8" />
    <img class="avatar avatar-1" src="avatars/lavine.svg" alt="Lavine"/><img class="avatar avatar-2" src="avatars/xi-yuqi.svg" alt="奚钰淇"/><img class="avatar avatar-3" src="avatars/gaazone.svg" alt="Gaazone"/><img class="avatar avatar-4" src="avatars/xu-renbing.svg" alt="许人冰"/><img class="avatar avatar-5" src="avatars/cieye.svg" alt="Cieye"/>
  </body>
</html>
