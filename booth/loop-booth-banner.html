<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Loop Booth Banner</title>
    <style>
      @page { size: 750mm 2000mm; margin: 0; }
      * { box-sizing: border-box; }
      html, body { width: 750px; height: 2000px; margin: 0; background: #031127; }
      img { display: block; width: 750px; height: 2000px; }
      @media print {
        html, body { width: 750mm; height: 2000mm; print-color-adjust: exact; -webkit-print-color-adjust: exact; }
        img { width: 750mm; height: 2000mm; }
      }
    </style>
  </head>
  <body>
    <img src="loop-booth-banner.svg" alt="Loop booth banner" />
  </body>
</html>
